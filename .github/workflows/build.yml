name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Astro (node_modules/.astro) and astro-og-canvas (node_modules/.astro-og-canvas)
      # keep content-hashed image caches on disk. Restoring them lets the build skip
      # re-optimizing unchanged screenshots and re-rendering unchanged OG images.
      # PRs only restore; pushes to main save a fresh entry (see the last step).
      - name: Restore Astro image caches
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules/.astro
            node_modules/.astro-og-canvas
          key: astro-images-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            astro-images-v1-${{ runner.os }}-

      - name: Build
        id: build
        run: pnpm run build

      - name: Comment link validation issues on PR
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          steps.build.outputs.link_validation_failed == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: starlight-links-validator
          message: |
            ## Starlight links validator found issues
            
            The docs build reported link validation issues.
            
            - Check the **job summary** table in this run for file/link details.
            - Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Remove stale link validation comment
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          steps.build.outputs.link_validation_failed != 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: starlight-links-validator
          delete: true

      - name: Find unused images
        run: pnpm run find-unused-images

      - name: Save Astro image caches
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules/.astro
            node_modules/.astro-og-canvas
          key: astro-images-v1-${{ runner.os }}-${{ github.sha }}
